name: Build ClaudeOS ISO
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ls -la
      - run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
      - run: 'docker run --rm --privileged -v "$PWD":/work -w /work debian:bookworm bash -c "apt-get update && apt-get install -y sudo && bash claudeos-eee.sh build"'
      - uses: actions/upload-artifact@v4
        with:
          name: claudeos-iso
          path: claudeos.iso
